<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, 
    initial-scale=1.0">
    <link rel="stylesheet" href="myPortcss.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
    <!-- https://remixicon.com/ -->



    <title>MiCogito</title>

</head>
<body id="idbody">
    <header class="header">
        <a href="#" class="logo"><span>Mi Cogito</span></a>
        
        <div class="nav-btn-container" id="nav-btn-container">

            <i class="ri-code-s-slash-line left-logo hlogo"></i>

                <ul class="nav-btn" id="nav-btn">
                    <li><a href="#">Home</a></li>
                    <li><a href="#about">About</a></li>
                    <li><a href="#experience">Experience</a></li>
                    <li><a href="#">Projects</a></li>
                    <li><a href="#">Contacts</a></li>
                </ul>

            <i class="ri-folder-fill hlogo right-logo"></i>

        </div>

        <i class="fa-solid fa-bars" id="menu-icon"></i>

        <button class="dlmode" id="dlmode">
            <i class="ri-moon-clear-line"></i>
            <i class="ri-sun-fill"></i>
        </button>

        <div class="log-in">
        <i class="ri-user-line"></i>
        <button class="loginbtn">Login</button>
        </div>
    </header>

    <div class="dice">
        <div class="roll" type="button">
            <div class="dice-container">
                <div class="face front"></div>
                <div class="face back"></div>
                <div class="face top"></div>
                <div class="face bottom"></div>
                <div class="face right"></div>
                <div class="face left"></div>
            </div>
        </div>
        <div class="word-display"><h3>Hello!</h3></div>
        <div class="short-tagline"><h3>Let’s make something amazing together.</h3></div>

    </div>

    <section class="about" id="about">
        <div class="about-container">
            <img src="images/confused.jpg" alt="confusedmf">

            <div class="about-info">

                <div class="about-txt">
                    <h3>Hi, I'm</h3>
                    <h1>Sam Cases</h1>
                    <span>Web Developer</span>
                </div>

                <div class="about-btn">

                    <div class="btn">Downloads</div>
                    <div class="btn">Contacts</div>
                </div>

                <div class="about-socials">
                    <i class="ri-github-fill"></i>
                    <i class="ri-facebook-circle-fill"></i>

                </div>

            </div>
        </div>
    </section>
    
    <script src="myPortDice.js"></script>
    <script src="darkmodeJS.js"></script>
    
</body>
</html>
