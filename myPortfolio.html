<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, 
    initial-scale=1.0">
    <link rel="stylesheet" href="myPortcss.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <title>MiCogito</title>

</head>
<body>
    <header class="header">
        <a href="#" class="logo"><span>Mi Cogito</span></a>

        <ul class="nav-btn">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Experience</a></li>
            <li><a href="#">Projects</a></li>
            <li><a href="#">Contacts</a></li>
        </ul>

        <i class="fa-solid fa-bars" id="menu-icon"></i>

        <button class="visit-btn">Visit</button>
    </header>

    <div class="dice">
        <div class="roll" type="button">
            <div class="dice-container">
                <div class="face front"></div>
                <div class="face back"></div>
                <div class="face top"></div>
                <div class="face bottom"></div>
                <div class="face right"></div>
                <div class="face left"></div>
            </div>
        </div>
        <div class="word-display"><h3>Hello!</h3></div>

    </div>

    <section class="about" id="about">
        <div class="about-container">
            <img src="confused.jpg" alt="confusedmf">

            <div class="about-info">

                <div class="about-txt">
                    <h3>Hi, I'm</h3>
                    <h1>Confused</h1>
                    <span>Developer</span>
                </div>

                <div class="about-btn">

                    <div class="btn">Downloads</div>
                    <div class="btn">Contacts</div>
                </div>

                <div class="about-socials">
                    <i class="fa-brands fa-github"></i>
                    <i class="fa-brands fa-facebook"></i>

                </div>

            </div>
        </div>
    </section>
    
    <script src="myPortjs.js"></script>
</body>
</html>
